; AuroraShop — endurecimiento de PHP 8.3 (issue #40)
; Se carga despues de php.ini-production y de los .ini de la imagen base.

; --- No revelar informacion ---
expose_php = Off
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On
; error_log no se fija aqui: sin archivo, FPM envia los errores a stderr (catch_workers_output)

; --- Inclusion remota y funciones peligrosas ---
allow_url_fopen = Off
allow_url_include = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,dl,show_source,highlight_file,posix_kill,posix_setuid,posix_setgid,posix_setpgid,posix_setsid,posix_mkfifo
cgi.fix_pathinfo = 0

; --- Solo puede tocar su codigo, temporales y la config generada ---
open_basedir = /var/www/:/tmp/:/run/aurora/

; --- Subidas y limites (alineados con client_max_body_size de Nginx) ---
file_uploads = On
upload_max_filesize = 8M
post_max_size = 10M
max_file_uploads = 10
upload_tmp_dir = /tmp
max_execution_time = 30
max_input_time = 30
max_input_vars = 3000
memory_limit = 256M

; --- Sesiones PHP (WooCommerce usa las suyas, esto cubre plugins) ---
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.save_path = /tmp
session.sid_length = 48
session.sid_bits_per_character = 6

; --- OPcache: la imagen es inmutable, no hace falta revisar timestamps ---
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.interned_strings_buffer = 16
