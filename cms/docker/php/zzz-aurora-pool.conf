; AuroraShop — pool de PHP-FPM (issue #40)
; El nombre empieza con "zzz" para cargarse despues de zz-docker.conf de la imagen base.

[www]
; Solo localhost: Nginx vive en el mismo pod (o mismo namespace de red en compose)
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

request_terminate_timeout = 60s

; Solo se ejecutan archivos .php
security.limit_extensions = .php

; Los workers no heredan variables de entorno (la config va en /run/aurora/config.php)
clear_env = yes

; Errores de PHP a stderr; el access log lo lleva Nginx
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
