# AuroraShop — nginx.conf principal (issue #40)
# Corre como UID 10001 con sistema de archivos de solo lectura: todo lo escribible va a /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # No revelar version
    server_tokens off;

    # Temporales en /tmp (rootfs read-only)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Log estructurado con request_id (correlacion con PHP y SIEM). Sin cuerpo ni cookies.
    log_format aurora_json escape=json
      '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
      '"xff":"$http_x_forwarded_for","method":"$request_method","uri":"$uri",'
      '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
      '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent",'
      '"referer":"$http_referer","host":"$host"}';
    access_log /dev/stdout aurora_json;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 30s;

    # Limites contra cuerpos grandes y clientes lentos (alineados con php.ini)
    client_max_body_size       10m;
    client_body_buffer_size    128k;
    client_body_timeout        15s;
    client_header_timeout      15s;
    send_timeout               30s;
    large_client_header_buffers 4 16k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # HTTPS real lo termina Cloudflare/LB; el LB indica el esquema original
    map $http_x_forwarded_proto $aurora_https {
        default "";
        https   on;
    }

    # Rate limit de defensa en profundidad (Cloudflare es la primera linea)
    # TODO(#39/#31): en GKE configurar set_real_ip_from con los rangos del LB para limitar por IP real.
    limit_req_zone $binary_remote_addr zone=aurora_login:10m rate=10r/m;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
