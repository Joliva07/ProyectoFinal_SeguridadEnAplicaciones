# AuroraShop — servidor del storefront (issue #40, base para #44)
# El orden de los bloques "location ~" importa: Nginx usa la PRIMERA regex que coincide,
# por eso las denegaciones van antes del bloque generico de PHP.

server {
    listen 8080 default_server;
    server_name _;

    root  /var/www/html;
    index index.php;

    # --- Cabeceras de seguridad (no usar add_header dentro de location: anula estas) ---
    # HSTS lo pone Cloudflare en el borde (#31); en local se navega por http.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header X-Request-ID $request_id always;

    # --- Salud para probes de K8s / healthcheck de Docker ---
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- XML-RPC deshabilitado (fuerza bruta amplificada, pingbacks) ---
    location = /xmlrpc.php {
        return 403;
    }

    # Instalador y asistente de configuracion: nadie desde la web puede "reclamar" el sitio.
    # WordPress se instala desde dentro del pod (kubectl exec), ver README.
    location ~ ^/wp-admin/(install|setup-config)\.php$ {
        return 403;
    }

    # --- Login con rate limit ---
    location = /wp-login.php {
        limit_req zone=aurora_login burst=5 nodelay;
        include /etc/nginx/snippets/aurora-php.conf;
    }

    # --- Archivos ocultos (.git, .env, .htaccess...) salvo .well-known ---
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # --- Archivos sensibles o que revelan version ---
    location ~* ^/(readme\.html|license\.txt|wp-config[^/]*|composer\.(json|lock)|package(-lock)?\.json)$ {
        deny all;
    }
    location ~* \.(sql|bak|old|orig|save|swp|log|ini|sh|env|dist|lock|tar|gz|zip)$ {
        deny all;
    }
    # readme/changelog de plugins y temas revelan versiones exactas (WPScan los usa)
    location ~* ^/wp-content/.*\.(txt|md)$ {
        deny all;
    }

    # --- Uploads: nunca ejecutar codigo; logs y descargas de WooCommerce privados ---
    location ~* ^/wp-content/uploads/(wc-logs|woocommerce_uploads)/ {
        deny all;
    }
    location ~* ^/wp-content/uploads/.*\.(php\d*|phtml|phar|pht|phps|cgi|pl|py|sh)$ {
        deny all;
    }

    # --- Ningun PHP directo dentro de plugins/temas/wp-content ---
    location ~* ^/wp-content/.*\.php$ {
        deny all;
    }

    # --- Estaticos ---
    location ~* \.(css|js|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # --- Rutas inexistentes en plugins/temas: 404 de Nginx, sin pasar por PHP ni la BD ---
    # Un WPScan agresivo prueba miles de /wp-content/plugins/<slug>/; antes cada una cargaba
    # WordPress completo (issue #44). Va despues de "Estaticos" para que los assets reales
    # conserven su cache.
    location ~* ^/wp-content/(plugins|themes|mu-plugins)/ {
        try_files $uri =404;
    }

    # --- WordPress ---
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include /etc/nginx/snippets/aurora-php.conf;
    }
}
