apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
  - ingress.yaml
  - frontendconfig.yaml
  - backendconfig.yaml
  - secrets.yaml
configMapGenerator:
  - name: aurorashop-config
    literals:
      - DB_NAME=aurorashop_staging
      - DB_USER=sa-gke-workload-staging
      - WP_ENVIRONMENT_TYPE=staging
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: Deployment
      name: aurorashop
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: aurorashop
      spec:
        template:
          spec:
            volumes:
              - name: media
                csi:
                  volumeAttributes:
                    bucketName: aurorashop-media-aurorashop-sec-umg-staging
  - target:
      kind: Service
      name: aurorashop-web
    patch: |-
      - op: add
        path: /metadata/annotations/cloud.google.com~1backend-config
        value: '{"default":"aurorashop-backend"}'
