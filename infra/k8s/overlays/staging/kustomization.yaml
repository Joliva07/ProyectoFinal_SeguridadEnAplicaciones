apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
  - ingress.yaml
  - backendconfig.yaml
  - secrets.yaml
configMapGenerator:
  - name: aurorashop-config
    literals:
      - DB_NAME=aurorashop_staging
      - DB_USER=sa-gke-workload-staging
      - WP_ENVIRONMENT_TYPE=staging
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: Deployment
      name: aurorashop
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/4/csi/volumeAttributes/bucketName
        value: aurorashop-media-aurorashop-sec-umg-staging
