apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aurorashop
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: aurorashop-staging-ingress-ip
    networking.gke.io/v1beta1.FrontendConfig: aurorashop-frontend
spec:
  ingressClassName: gce
  tls:
    - hosts:
        - staging-aurorashop.ancordss.me.uk
      secretName: aurorashop-origin-tls
  rules:
    - host: staging-aurorashop.ancordss.me.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aurorashop-web
                port:
                  number: 80
