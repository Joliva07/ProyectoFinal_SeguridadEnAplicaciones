apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: aurorashop-backend
spec:
  # Las conexiones abiertas a un pod que sale del balanceador terminan en vez de cortarse (502)
  connectionDraining:
    drainingTimeoutSec: 30
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /healthz
    port: 8080
  securityPolicy:
    name: aurorashop-demo-edge
