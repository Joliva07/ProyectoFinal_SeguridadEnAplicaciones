apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: aurorashop-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/aurorashop-sec-umg/secrets/aurorashop-staging-auth-keys/versions/latest"
        path: "auth-keys"
      - resourceName: "projects/aurorashop-sec-umg/secrets/aurorashop-staging-salts/versions/latest"
        path: "salts"
      - resourceName: "projects/aurorashop-sec-umg/secrets/aurorashop-staging-payment-sandbox/versions/latest"
        path: "payment-sandbox"
