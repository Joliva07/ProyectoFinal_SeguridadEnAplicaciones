apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
  - secrets.yaml
configMapGenerator:
  - name: aurorashop-config
    literals:
      - DB_NAME=aurorashop_dev
      - DB_USER=sa-gke-workload-dev
      - WP_ENVIRONMENT_TYPE=development
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: Deployment
      name: aurorashop
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/4/csi/volumeAttributes/bucketName
        value: aurorashop-media-aurorashop-sec-umg-dev
