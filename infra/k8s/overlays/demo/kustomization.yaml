apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aurorashop
resources:
  - ../../base
  - ingress.yaml
  - frontendconfig.yaml
  - backendconfig.yaml
  - secrets.yaml
configMapGenerator:
  - name: aurorashop-config
    literals:
      - DB_NAME=aurorashop_demo
      - DB_USER=sa-gke-workload-demo
      - WP_ENVIRONMENT_TYPE=production
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: Service
      name: aurorashop-web
    patch: |-
      - op: add
        path: /metadata/annotations/cloud.google.com~1backend-config
        value: '{"default":"aurorashop-backend"}'
