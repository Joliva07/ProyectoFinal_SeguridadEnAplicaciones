apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurorashop
  labels:
    app.kubernetes.io/name: aurorashop
    app.kubernetes.io/part-of: aurorashop
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: aurorashop
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aurorashop
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      serviceAccountName: aurorashop-app
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aurorashop
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: aurorashop-nginx:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            appArmorProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: media
              mountPath: /var/www/html/wp-content/uploads
              readOnly: true
        - name: php-fpm
          image: aurorashop-php:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: fpm
              containerPort: 9000
              protocol: TCP
          env:
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: aurorashop-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: aurorashop-config
                  key: DB_USER
            - name: DB_PASSWORD
              value: ""
            - name: WP_ENVIRONMENT_TYPE
              valueFrom:
                configMapKeyRef:
                  name: aurorashop-config
                  key: WP_ENVIRONMENT_TYPE
            - name: WP_SECRET_DIR
              value: /var/run/aurorashop-secrets
          readinessProbe:
            tcpSocket:
              port: fpm
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: fpm
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            appArmorProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: php-tmp
              mountPath: /tmp
            - name: media
              mountPath: /var/www/html/wp-content/uploads
            - name: app-secrets
              mountPath: /var/run/aurorashop-secrets
              readOnly: true
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.28.0
          imagePullPolicy: IfNotPresent
          args:
            - "--private-ip"
            - "--auto-iam-authn"
            - "--address=127.0.0.1"
            - "--port=3306"
            - "aurorashop-sec-umg:us-central1:aurorashop-demo-mysql"
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            appArmorProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: nginx-cache
          emptyDir: { sizeLimit: 128Mi }
        - name: nginx-run
          emptyDir: { sizeLimit: 16Mi }
        - name: php-tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: media
          csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: false
            volumeAttributes:
              bucketName: aurorashop-media-aurorashop-sec-umg-demo
              mountOptions: "implicit-dirs,uid=10001,gid=10001,file-mode=0640,dir-mode=0750"
        - name: app-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: aurorashop-secrets
