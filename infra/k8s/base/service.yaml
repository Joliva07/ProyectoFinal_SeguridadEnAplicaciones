apiVersion: v1
kind: Service
metadata:
  name: aurorashop-web
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default":"aurorashop-backend"}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aurorashop
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
