name: Terraform infrastructure

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**/*.tf"
      - "infra/**/*.tfvars.example"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**/*.tf"
      - "infra/**/*.tfvars.example"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "Plan o apply de infraestructura"
        required: true
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

jobs:
  validate:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - name: Format and validate without cloud credentials
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate -no-color

  plan:
    name: Terraform remote plan
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_project_id: aurorashop-sec-umg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.TF_WIF_PROVIDER }}
          service_account: ${{ secrets.TF_SERVICE_ACCOUNT }}
          project_id: aurorashop-sec-umg
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - name: Initialize backend and plan
        working-directory: infra
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "::error::Configura la variable de repositorio TF_STATE_BUCKET creada por Javier."
            exit 1
          fi
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=terraform/aurorashop"
          terraform workspace select demo || terraform workspace new demo
          terraform plan -input=false -no-color -var-file=terraform.tfvars.example

  apply:
    name: Terraform apply (protected environment)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'apply' && github.ref == 'refs/heads/main'
    needs: [validate, plan]
    runs-on: ubuntu-latest
    environment: infra-apply
    permissions:
      contents: read
      id-token: write
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_project_id: aurorashop-sec-umg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.TF_WIF_PROVIDER }}
          service_account: ${{ secrets.TF_SERVICE_ACCOUNT }}
          project_id: aurorashop-sec-umg
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - name: Re-plan and apply only after environment approval
        working-directory: infra
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "::error::Configura la variable de repositorio TF_STATE_BUCKET creada por Javier."
            exit 1
          fi
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=terraform/aurorashop"
          terraform workspace select demo || terraform workspace new demo
          terraform plan -input=false -no-color -var-file=terraform.tfvars.example -out=tfplan
          terraform apply -input=false -no-color tfplan
